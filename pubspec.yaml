name: vol_admin
description: VÔL Network admin panel.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.9.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icons/
    - assets/icons/nav/
    - assets/icons/stats/
    - assets/illustrations/
